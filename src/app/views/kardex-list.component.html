<div class="container-fluid">
    <div class="row">
      <div class="d-flex">
        <div class="col-2 col-md-2 me-2">
          <button class="btn btn-add rounded-0 " (click)="openDialogRangeDates()">
            <i class="fa-solid fa-file"></i>
            <span *ngIf="isDesktop"> &nbsp; Generar reporte</span>
          </button>
        </div>
      </div>

      <div class="mt-5">
        <table mat-table [dataSource]="dataKardex" matSort class="mat-elevation-z8">
  
          <ng-container matColumnDef="product">
            <th mat-header-cell *matHeaderCellDef mat-sort-header ngClass="bg-darkTheme"> Producto </th>
            <td mat-cell *matCellDef="let element" ngClass="bg-body-theme-table"> {{ element.nameProduct }} </td>
          </ng-container>
  
          <ng-container matColumnDef="transactionDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header ngClass="bg-darkTheme"> Fecha </th>
            <td mat-cell *matCellDef="let element" ngClass="bg-body-theme-table"> {{ element.transactionDate }} </td>
          </ng-container>
  
          <ng-container matColumnDef="transactionType">
            <th mat-header-cell *matHeaderCellDef mat-sort-header ngClass="bg-darkTheme"> Tipo </th>
            <td mat-cell *matCellDef="let element" ngClass="bg-body-theme-table"> {{ element.transactionType }} </td>
          </ng-container>
  
          <ng-container matColumnDef="previousStock">
            <th mat-header-cell *matHeaderCellDef mat-sort-header ngClass="bg-darkTheme"> Cantidad anterior </th>
            <td mat-cell *matCellDef="let element" ngClass="bg-body-theme-table"> {{ element.previousStock }} </td>
          </ng-container>
  
          <ng-container matColumnDef="currentStock">
            <th mat-header-cell *matHeaderCellDef mat-sort-header ngClass="bg-darkTheme"> Cantidad actual </th>
            <td mat-cell *matCellDef="let element" ngClass="bg-body-theme-table"> {{ element.currentStock }} </td>
          </ng-container>

          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header ngClass="bg-darkTheme"> Precio </th>
            <td mat-cell *matCellDef="let element" ngClass="bg-body-theme-table"> {{element.price}} </td>
          </ng-container>
  
          <ng-container matColumnDef="observations">
            <th mat-header-cell *matHeaderCellDef mat-sort-header ngClass="bg-darkTheme"> Descripci&oacute;n </th>
            <td mat-cell *matCellDef="let element" ngClass="bg-body-theme-table"> {{element.observations}} </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
  
        <mat-paginator *ngIf="!noResults" [pageSizeOptions]="[7]" showFirstLastButtons
          [ngStyle]="{'display': listKardex.length > 0 ? 'block' : 'none'}">
        </mat-paginator>
      </div>
    </div>
  </div>

<ng-template #dialogRangeDates let-data>
  <div class="card">
    <div class="card-header bg-dark d-flex justify-content-between align-items-center">
      <h6 class="text-light mt-2">SELECCIONAR FECHAS DEL REPORTE</h6>
      <i class="fa-solid fa-xmark text-danger" style="cursor: pointer;" (click)="closedModal()"></i>
    </div>
    <div class="card-body">
      <mat-dialog-content >
        <div class="d-flex flex-column">
          <div class="col-lg-12">
            <mat-form-field class="w-100">
              <input matInput [matDatepicker]="picker1" placeholder="Fecha inicial" [(ngModel)]="startDate" required>
              <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
              <mat-datepicker #picker1></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-lg-12">
            <mat-form-field class="w-100">
              <input matInput [matDatepicker]="picker2" placeholder="Fecha final" [(ngModel)]="endDate" required>
              <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
              <mat-datepicker #picker2></mat-datepicker>
            </mat-form-field>
          </div>
        </div>
      </mat-dialog-content>
    </div>
    <div class="card-footer text-center">
      <div class="col-lg-12">
        <button class="btn btn-theme rounded-0" (click)="generatePDF()" [disabled]="startDate === '' || endDate === ''"><i class="fa-regular fa-file-pdf"></i> &nbsp;Descargar reporte</button>
      </div>
    </div>
  </div>
</ng-template>

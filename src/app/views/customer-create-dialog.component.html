<div [ngClass]="{'scrollable-content': !isDesktop}">
  <div class="card">
    <div class="card-header bg-dark d-flex justify-content-between align-items-center">
      <h6 class="text-light mt-2">{{ accion | uppercase }} CLIENTE </h6>
      <i class="fa-solid fa-xmark text-danger" style="cursor: pointer;" (click)="closedModal()"></i>
    </div>
    <div class="card-body">
      <div class="d-flex flex-row mt-1">
        <div class="col-lg-12 mb-4">
          <form [formGroup]="customerForm">
            <div class="container">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="identification" class="form-label">N&uacute;mero de c&eacute;dula</label>
                  <input [ngClass]="{ 'is-invalid': customerForm.get('identification')?.invalid && (customerForm.get('identification')?.touched || customerForm.get('identification')?.dirty) }" 
                    oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(\..*)\./g, '$1');"
                    maxlength="10" type="text" class="form-control" formControlName="identification" id="identification"
                    placeholder="Cedula">
                  <div *ngIf="customerForm.get('identification')?.invalid && (customerForm.get('identification')?.touched || customerForm.get('identification')?.dirty)" class="invalid-feedback">
                    <small *ngIf="customerForm.get('identification')?.errors?.['required']">La c&eacute;dula es obligatoria.</small>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="name" class="form-label">Nombre</label>
                  <input [ngClass]="{ 'is-invalid': customerForm.get('name')?.invalid && (customerForm.get('name')?.touched || customerForm.get('name')?.dirty) }"
                    oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s ]/g, '').replace(/(\..*)\./g, '$1');"
                    type="text" class="form-control" formControlName="name" id="name" placeholder="Nombre ">
                    <div *ngIf="customerForm.get('name')?.invalid && (customerForm.get('name')?.touched || customerForm.get('name')?.dirty)" class="invalid-feedback">
                      <small *ngIf="customerForm.get('name')?.errors?.['required']">El nombre es obligatorio.</small>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="surname" class="form-label">Apellido</label>
                  <input [ngClass]="{ 'is-invalid': customerForm.get('surname')?.invalid && (customerForm.get('surname')?.touched || customerForm.get('surname')?.dirty) }"
                    oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s ]/g, '').replace(/(\..*)\./g, '$1');"
                    type="text" class="form-control" formControlName="surname" id="surname" placeholder="Apellido">
                    <div *ngIf="customerForm.get('surname')?.invalid && (customerForm.get('surname')?.touched || customerForm.get('surname')?.dirty)" class="invalid-feedback">
                      <small *ngIf="customerForm.get('surname')?.errors?.['required']">El apellido es obligatorio.</small>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="address" class="form-label">Direcci&oacute;n</label>
                  <input [ngClass]="{ 'is-invalid': customerForm.get('address')?.invalid && (customerForm.get('address')?.touched || customerForm.get('address')?.dirty) }"
                    type="text" class="form-control" formControlName="address" id="address" placeholder="Direccion">
                  <div *ngIf="customerForm.get('address')?.invalid && (customerForm.get('address')?.touched || customerForm.get('address')?.dirty)" class="invalid-feedback">
                    <small *ngIf="customerForm.get('address')?.errors?.['required']">La direcci&oacute;n es obligatoria.</small>
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="phone_number" class="form-label">N&uacute;mero de tel&eacute;fono</label>
                  <input [ngClass]="{ 'is-invalid': customerForm.get('phone_number')?.invalid && (customerForm.get('phone_number')?.touched || customerForm.get('phone_number')?.dirty) }" 
                    oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(\..*)\./g, '$1');" maxlength="10" type="text" class="form-control" 
                    formControlName="phone_number" id="phone_number" placeholder="Telefono">
                    <div *ngIf="customerForm.get('phone_number')?.invalid && (customerForm.get('phone_number')?.touched || customerForm.get('phone_number')?.dirty)" class="invalid-feedback">
                      <small *ngIf="customerForm.get('phone_number')?.errors?.['required']">El tel&eacute;fono es obligatorio.</small>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input [ngClass]="{ 'is-invalid': customerForm.get('email')?.invalid && (customerForm.get('email')?.touched || customerForm.get('email')?.dirty) }" 
                    type="text" class="form-control" formControlName="email" id="email" placeholder="Email">
                  <div *ngIf="customerForm.get('email')?.invalid && (customerForm.get('email')?.touched || customerForm.get('email')?.dirty)" class="invalid-feedback">
                    <small *ngIf="customerForm.get('email')?.errors?.['required']">El email es obligatorio.</small>
                    <small *ngIf="customerForm.get('email')?.errors?.['email']">Ingresa un email v&aacute;lido.</small>
                  </div>
                </div>
                <div class="col-6 col-md-12 mb-3 text-center mt-3" *ngIf="btn !== 'Actualizar'">
                  <button class="btn btn-theme rounded-0" (click)="saveCustomer()" [disabled]="customerForm.invalid"> <i class="fa-regular fa-floppy-disk"></i> {{btn}}</button>
                </div>
                <div class="col-6 col-md-6 mb-3 text-center mt-3" *ngIf="btn === 'Actualizar'">
                  <button class="btn btn-theme rounded-0" (click)="updateCustomer()" [disabled]="customerForm.invalid"> <i class="fa-regular fa-floppy-disk"></i> {{btn}}</button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

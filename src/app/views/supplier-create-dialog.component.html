<div [ngClass]="{'scrollable-content': !isDesktop}">
  <div class="card">
    <div class="card-header bg-dark d-flex justify-content-between align-items-center">
      <h6 class="text-light mt-2">{{ accion | uppercase }} PROVEEDOR </h6>
      <i class="fa-solid fa-xmark text-danger" style="cursor: pointer;" (click)="cancelar()"></i>
    </div>
    <div class="card-body">
      <div class="d-flex flex-row mt-4">
        <div class="col-lg-12 mb-4" >
            <form [formGroup]="supplierForm">
                <div class="container">
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="comercialName" class="form-label">Nombre Comercial:</label>
                      <input oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s ]/g, '').replace(/(\..*)\./g, '$1');" type="text" class="form-control" formControlName="comercialName" id="comercialName" placeholder="">
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="isForeign" class="form-label">Es extranjero</label>
                      <select class="form-select" aria-label="Default select example" formControlName="isForeign">
                        <option [value]="true" >Si</option>
                        <option [value]="false" >No</option>
                      </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Correo electr&oacute;nico</label>
                        <input type="text" class="form-control" formControlName="email" id="email" placeholder="">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="address" class="form-label">Direcci&oacute;n</label>
                        <input type="text" class="form-control" formControlName="address" id="address" placeholder="">
                    </div>
    
                  </div>
                  <div class="row align-items-center">
                    <div class="col-12 col-md-12 mb-3 text-center mt-3" *ngIf="btn !== 'Actualizar'">
                      <button class="btn btn-theme rounded-0" [disabled]="supplierForm.invalid" (click)="saveSupplier()"><i class="fa-regular fa-floppy-disk"></i> {{btn}} </button>
                    </div>
                    <div class="col-12 col-md-12 mb-3 text-center mt-3" *ngIf="btn === 'Actualizar'">
                      <button class="btn btn-theme rounded-0" [disabled]="supplierForm.invalid" (click)="updateSupplier()"><i class="fa-regular fa-floppy-disk"></i> {{btn}} </button>
                    </div>
                  </div>
                </div>
              </form>           
        </div>
      </div>
    </div>
  </div>
</div>

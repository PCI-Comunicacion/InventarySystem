<div [ngClass]="{'scrollable-content': !isDesktop}">
    <div class="card">
        <div class="card-header bg-dark d-flex justify-content-between align-items-center">
            <h6 class="text-light mt-2">ORDEN DE SALIDA</h6>
            <i class="fa-solid fa-xmark text-danger" style="cursor: pointer;" (click)="cancel()"></i>
        </div>
        <div class="card-body">
            <div class="d-flex flex-row mt-4">
                <div class="col-lg-12 mb-4">
                    <form [formGroup]="expensesForm">
                        <div class="container">
                            <div class="row">
                                <div class="col-12 col-md-12 mb-3">
                                    <label for="nameCustomer" class="form-label">Cliente: </label>
                                    <select class="form-select" aria-label="Default select example"
                                        formControlName="nameCustomer">
                                        <option *ngFor="let option of customers" [value]="option.id">{{ option.name }}
                                        </option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-12 mb-3">
                                    <label for="nameProduct" class="form-label">Producto: </label>
                                    <select class="form-select" aria-label="Default select example"
                                        formControlName="nameProduct">
                                        <option *ngFor="let option of products" [value]="option.id">{{ option.name }}
                                        </option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-12 mb-3">
                                    <label for="type" class="form-label">Tipo: </label>
                                    <select class="form-select" aria-label="Default select example"
                                        formControlName="type">
                                        <option *ngFor="let option of typeOptions" [value]="option.id">{{ option.name }}
                                        </option>
                                    </select>
                                </div>
                                <div class="col-12 col-md-12 mb-3">
                                    <label for="observations" class="form-label">Descripci&oacute;n: </label>
                                    <input type="text"
                                        oninput="this.value = this.value.replace(/[^A-Za-zñÑáéíóúÁÉÍÓÚ\s ]/g, '').replace(/(\..*)\./g, '$1');"
                                        placeholder="Observaciones" aria-label="observations"
                                        formControlName="observations" class="form-control">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-6 col-md-6 mb-3">
                                    <label for="status" class="form-label">Estado: </label>
                                    <select class="form-select" formControlName="status"
                                        (change)="onStatusChange($event)">
                                        <option *ngFor="let status of statusOptions" [value]="status.id">
                                            {{ status.name }}
                                        </option>
                                    </select>
                                </div>
                                <div class="col-6 col-md-6 mb-3">
                                    <label for="quantity" class="form-label">Cantidad: </label>
                                    <input type="text"
                                        oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(\..*)\./g, '$1');"
                                        placeholder="10" aria-label="Cantidad" formControlName="quantity"
                                        class="form-control">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-12 col-md-12 mb-3">
                                    <label for="paymentMethod" class="form-label">M&eacute;todo de Pago: </label>
                                    <select class="form-select" formControlName="paymentMethod"
                                        (change)="onPaymentMethodChange($event)">
                                        <option *ngFor="let option of paymentMethods" [value]="option.id">
                                            {{ option.name }}
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="row align-items-center">
                                <div class="col-12 col-md-12 mb-3 text-center mt-3">
                                    <button class="btn btn-theme rounded-0" (click)="saveSaleOrder()"><i class="fa-regular fa-floppy-disk"></i> Registrar </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
